<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Math Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-chtml.min.js"></script>
<style>
:root {
  --bg:       #0F1117;
  --surf:     #171B26;
  --surf2:    #1E2333;
  --border:   #2A3050;
  --borderB:  #3D4A75;
  --accent:   #00E5A0;
  --accentD:  rgba(0,229,160,.12);
  --warn:     #F5A623;
  --danger:   #FF5F57;
  --purple:   #8B5CF6;
  --text:     #E8ECF4;
  --muted:    #6B7599;
  --dim:      #3D4A75;
  --mono:     'JetBrains Mono', monospace;
  --sans:     'Inter', sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding-bottom:60px}

header{width:100%;border-bottom:1px solid var(--border);padding:14px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);z-index:10}
.logo{font-family:var(--mono);font-weight:600;font-size:15px;color:var(--accent)}
.logo span{color:var(--muted);font-weight:400}
.header-right{display:flex;align-items:center;gap:16px;font-size:12px;color:var(--muted);font-family:var(--mono)}
.elo-pill{background:var(--surf2);border:1px solid var(--border);padding:4px 12px;border-radius:20px;font-size:12px;color:var(--text)}
.elo-pill b{color:var(--accent)}

.tab-bar{width:100%;max-width:820px;padding:20px 24px 0;display:flex;gap:8px;flex-wrap:wrap}
.tab-btn{font-family:var(--mono);font-size:12px;font-weight:500;padding:8px 18px;border-radius:20px;border:1px solid var(--border);background:var(--surf);color:var(--muted);cursor:pointer;transition:all .15s}
.tab-btn:hover{border-color:var(--borderB);color:var(--text)}
.tab-btn.active{border-color:var(--accent);background:var(--accentD);color:var(--accent)}

.selector-bar{width:100%;max-width:820px;padding:16px 24px 0;display:flex;flex-direction:column;gap:12px}
.no-results-main{font-family:var(--mono);color:var(--muted);padding:24px 0}

.ann-heading{font-family:var(--mono);margin:22px 0 10px;color:var(--text)}
.ann-h1{font-size:18px;font-weight:700}
.ann-h2{font-size:15px;font-weight:600;color:var(--muted)}
.ann-text{font-size:14px;line-height:1.8;margin-bottom:6px}
.ann-text p{margin-bottom:10px}
.qblock{margin:20px 0;padding:18px 20px;background:var(--surf2);border:1px solid var(--border);border-radius:10px}
.q-head{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--accent);margin-bottom:8px}
.q-statement{font-size:14px;line-height:1.7;margin-bottom:12px}
.qblock .answer-textarea{width:100%;min-height:120px;background:var(--surf);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--mono);font-size:13px;line-height:1.7;padding:12px 14px;resize:vertical;caret-color:var(--accent)}
.qblock .answer-textarea::placeholder{color:var(--dim)}
.qblock .answer-textarea:focus{outline:none;border-color:var(--borderB)}
.q-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.qblock .loading-bar{padding:12px 0}
.qblock .scores-panel{margin-top:14px;border-radius:8px;overflow:hidden}
.filter-row{display:flex;gap:10px;flex-wrap:wrap}
.filter-select{font-family:var(--mono);font-size:11px;padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surf);color:var(--text);cursor:pointer;transition:border-color .15s}
.filter-select:hover{border-color:var(--borderB)}
.prob-picker{display:flex;align-items:center;gap:12px}
.prob-select{flex:1;min-width:0}
.prob-count{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.no-results{font-family:var(--mono);font-size:12px;color:var(--muted);padding:6px 2px}
.prob-btn{font-family:var(--mono);font-size:11px;padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surf);color:var(--muted);cursor:pointer;transition:all .15s}
.prob-btn:hover{border-color:var(--borderB);color:var(--text)}
.prob-btn.active{border-color:var(--accent);background:var(--accentD);color:var(--accent)}

main{width:100%;max-width:820px;padding:20px 24px 0;display:flex;flex-direction:column;gap:20px}

.meta-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cat-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:-8px}
.cat-tag{font-family:var(--mono);font-size:11px;padding:4px 10px;border-radius:20px;background:var(--surf2);border:1px solid var(--border);color:var(--muted)}
.cat-tag.cat-level{color:var(--purple);border-color:rgba(139,92,246,.3);background:rgba(139,92,246,.08)}
.tag{font-family:var(--mono);font-size:11px;color:var(--accent);background:var(--accentD);border:1px solid rgba(0,229,160,.3);padding:4px 10px;border-radius:20px}
.diff-row{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.dots{display:flex;gap:3px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--border)}
.dot.on{background:var(--warn)}

.problem-card{background:var(--surf);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.prob-head{padding:16px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.prob-title{font-family:var(--mono);font-size:13px;font-weight:600}
.cadence{font-family:var(--mono);font-size:11px;color:var(--warn);background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.25);padding:3px 9px;border-radius:12px}
.prob-body{padding:24px 26px 20px;font-size:15px;line-height:1.8}
.prob-body p{margin-bottom:12px}
.math-block{margin:16px 0;padding:14px 18px;background:var(--surf2);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;overflow-x:auto}
.q-list{margin:8px 0 12px 22px;display:flex;flex-direction:column;gap:8px}
.q-list li{padding-left:4px}
.remark{font-size:13px;font-style:italic;color:var(--muted)}
.btn-hint{margin:0 26px 22px;font-family:var(--mono);font-size:11px;padding:6px 14px;border-radius:20px;border:1px solid rgba(245,166,35,.3);background:rgba(245,166,35,.07);color:var(--warn);cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-hint:hover{background:rgba(245,166,35,.15)}
.hint-box{display:none;margin:0 26px 22px;padding:11px 15px;background:rgba(245,166,35,.07);border:1px solid rgba(245,166,35,.2);border-radius:8px;font-size:13px;color:var(--warn);font-family:var(--mono);gap:10px}
.hint-box.on{display:flex}
.btn-correction{margin:0 26px 22px;font-family:var(--mono);font-size:11px;padding:6px 14px;border-radius:20px;border:1px solid rgba(59,130,246,.3);background:rgba(59,130,246,.07);color:#3B82F6;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-correction:hover{background:rgba(59,130,246,.15)}
.correction-box{display:none;margin:0 26px 22px;padding:16px 18px;background:var(--surf2);border:1px solid rgba(59,130,246,.25);border-left:3px solid #3B82F6;border-radius:0 8px 8px 0;font-size:14px;line-height:1.85}
.correction-box.on{display:block}
.correction-label{font-family:var(--mono);font-size:11px;font-weight:600;color:#3B82F6;text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px}
.correction-text p{margin-bottom:10px}

.answer-card{background:var(--surf);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.ans-head{padding:13px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:12px;color:var(--muted)}
.ans-head b{color:var(--text);font-weight:500}
textarea{width:100%;min-height:220px;background:transparent;border:none;outline:none;color:var(--text);font-family:var(--mono);font-size:13px;line-height:1.8;padding:18px 22px;resize:vertical;caret-color:var(--accent)}
textarea::placeholder{color:var(--dim)}
textarea:focus{background:rgba(0,229,160,.02)}
.ans-foot{padding:11px 18px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
.char-count{font-family:var(--mono);font-size:11px;color:var(--dim)}
.btn-val{background:var(--accent);color:#0A1A12;font-family:var(--mono);font-size:13px;font-weight:600;border:none;padding:9px 26px;border-radius:8px;cursor:pointer;transition:opacity .15s,transform .1s}
.btn-val:hover{opacity:.9}
.btn-val:active{transform:scale(.98)}
.btn-val:disabled{background:var(--border);color:var(--muted);cursor:not-allowed;transform:none;opacity:1}
.btn-advice{background:var(--purple);color:var(--text)}
.btn-advice:disabled{background:var(--border);color:var(--muted)}

.loading-bar{display:none;padding:18px 22px;gap:12px;align-items:center;font-family:var(--mono);font-size:13px;color:var(--muted)}
.loading-bar.on{display:flex}
.spinner{width:17px;height:17px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.load-msg{transition:opacity .3s}

.scores-panel{display:none;background:var(--surf);border:1px solid var(--border);border-radius:14px;overflow:hidden;animation:slideIn .35s ease}
.scores-panel.on{display:block}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.sc-head{padding:16px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sc-head h2{font-family:var(--mono);font-size:14px;font-weight:600}
.verdict{font-family:var(--mono);font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px}
.verdict.ok{background:rgba(0,229,160,.15);color:var(--accent);border:1px solid rgba(0,229,160,.35)}
.verdict.mid{background:rgba(245,166,35,.12);color:var(--warn);border:1px solid rgba(245,166,35,.3)}
.verdict.bad{background:rgba(255,95,87,.12);color:var(--danger);border:1px solid rgba(255,95,87,.3)}
.sc-grid{padding:20px 22px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sc-item{background:var(--surf2);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.sc-label{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:9px;text-transform:uppercase;letter-spacing:.3px;font-weight:500}
.sc-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.sc-track{flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.sc-fill{height:100%;border-radius:3px;width:0;transition:width .8s cubic-bezier(.16,1,.3,1)}
.fill-g{background:var(--accent)}.fill-m{background:var(--warn)}.fill-r{background:var(--danger)}
.sc-val{font-family:var(--mono);font-size:20px;font-weight:600;line-height:1;min-width:36px;text-align:right}
.sc-val.g{color:var(--accent)}.sc-val.m{color:var(--warn)}.sc-val.r{color:var(--danger)}
.sc-comment{font-size:12px;color:var(--muted);line-height:1.5}
.conf-row{grid-column:1/-1;background:var(--surf2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:14px}
.conf-label{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;font-weight:500;white-space:nowrap}
.conf-track{flex:1;height:7px;background:var(--border);border-radius:4px;overflow:hidden}
.conf-fill{height:100%;border-radius:4px;width:0;transition:width 1s cubic-bezier(.16,1,.3,1) .3s;background:linear-gradient(90deg,#3B82F6,#8B5CF6)}
.conf-pct{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--purple);white-space:nowrap}
.conf-note{font-size:11px;color:var(--dim);font-family:var(--mono);white-space:nowrap}
.feedback-wrap{padding:0 22px 20px}
.fb-label{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px}
.fb-text{font-size:14px;line-height:1.75;color:var(--text);background:var(--surf2);border:1px solid var(--border);border-radius:8px;padding:14px 16px}
.elo-row{padding:0 22px 20px;display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:13px;color:var(--muted)}
.elo-delta{font-size:20px;font-weight:600;color:var(--accent)}
.elo-delta.neg{color:var(--danger)}
.err-msg{display:none;padding:11px 15px;background:rgba(255,95,87,.1);border:1px solid rgba(255,95,87,.25);border-radius:8px;font-family:var(--mono);font-size:12px;color:var(--danger);margin:0 20px 14px}
.err-msg.on{display:block}
.btn-retry{display:none;margin:0 22px 20px;background:transparent;color:var(--muted);font-family:var(--mono);font-size:12px;border:1px solid var(--border);padding:7px 18px;border-radius:8px;cursor:pointer}
.btn-retry:hover{border-color:var(--borderB);color:var(--text)}
.new-prob-wrap{padding:0 22px 20px}
.btn-new{font-family:var(--mono);font-size:12px;padding:8px 20px;border-radius:8px;border:1px solid var(--borderB);background:transparent;color:var(--text);cursor:pointer;transition:all .15s}
.btn-new:hover{background:var(--surf2)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* ── Mobile ── */
@media(max-width:600px){
  .sc-grid{grid-template-columns:1fr}
  header{padding:12px 16px}
  #hdr-cat{display:none}
  .tab-bar{padding:16px 16px 0}
  .selector-bar{padding:14px 16px 0}
  main{padding:16px 16px 0}
  .prob-head,.ans-head,.sc-head{flex-direction:column;align-items:flex-start;gap:6px}
  .ans-foot,.q-foot{flex-direction:column;align-items:stretch;gap:10px}
  .ans-foot .btn-val,.q-foot .btn-val,.btn-advice{width:100%}
  .elo-row{flex-wrap:wrap;row-gap:6px}
  .conf-row{flex-wrap:wrap;row-gap:8px}
  .filter-select{flex:1 1 100%}
  .prob-picker{flex-wrap:wrap;row-gap:8px}
  .prob-select{flex-basis:100%}
}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:100;flex-direction:column;align-items:center;justify-content:center;gap:0">
  <div id="login-box" style="background:var(--surf);border:1px solid var(--border);border-radius:16px;padding:40px 36px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:20px;align-items:center">
    <div style="font-family:var(--mono);font-size:22px;font-weight:600;color:var(--accent)">Math<span style="color:var(--muted);font-weight:400">Arena</span></div>
    <div style="font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center">Accès restreint — entrez le mot de passe</div>
    <input id="login-input" type="password" placeholder="Mot de passe…"
      style="width:100%;background:var(--surf2);border:1px solid var(--border);border-radius:8px;padding:11px 14px;font-family:var(--mono);font-size:14px;color:var(--text);outline:none;caret-color:var(--accent);text-align:center;letter-spacing:2px"/>
    <div id="login-error" style="display:none;font-family:var(--mono);font-size:12px;color:var(--danger);text-align:center">Mot de passe incorrect</div>
    <button id="login-btn" onclick="submitLogin()"
      style="width:100%;background:var(--accent);color:#0A1A12;font-family:var(--mono);font-size:13px;font-weight:600;border:none;padding:11px;border-radius:8px;cursor:pointer">
      Accéder
    </button>
  </div>
</div>

<!-- APP -->
<div id="app-wrapper" style="display:none;width:100%;display:contents">
  <header>
    <div class="logo">Math<span>Arena</span></div>
    <div class="header-right">
      <span id="hdr-cat">—</span>
      <div class="elo-pill">ELO <b id="elo-display">1200</b></div>
    </div>
  </header>
  <div class="tab-bar" id="tab-bar">
    <button class="tab-btn" data-tab="cours" onclick="switchSection('cours')">Questions de cours</button>
    <button class="tab-btn active" data-tab="exercices" onclick="switchSection('exercices')">Exercices</button>
    <button class="tab-btn" data-tab="annales" onclick="switchSection('annales')">Annales de concours</button>
  </div>
  <div class="selector-bar" id="selector-bar"></div>
  <main id="main-content"></main>
</div>

<script>
// ═══════════════════════════════════════════════════════
// CONFIGURATION — modifie cette valeur avant de déployer
// ═══════════════════════════════════════════════════════
const WORKER_URL = 'https://holy-dawn-664a.armandgissler.workers.dev/';
// Le mot de passe et la clé Gemini sont dans Cloudflare.
// ═══════════════════════════════════════════════════════

// ── Chapitres du programme MP ───────────────────────────
const CHAPTERS = [
  {n:1,  name:'Groupes',                                  domain:'Algèbre'},
  {n:2,  name:'Arithmétique',                              domain:'Algèbre'},
  {n:3,  name:'Corps, polynômes, fractions rationnelles',  domain:'Algèbre'},
  {n:4,  name:'Algèbre linéaire',                          domain:'Algèbre'},
  {n:5,  name:'Réduction',                                 domain:'Algèbre'},
  {n:6,  name:'Espaces euclidiens',                        domain:'Algèbre'},
  {n:7,  name:'Endomorphismes symétriques',                domain:'Algèbre'},
  {n:8,  name:'Topologie matricielle',                     domain:'Algèbre'},
  {n:9,  name:'Espaces vectoriels normés et topologie',    domain:'Analyse'},
  {n:10, name:'Analyse de première année',                 domain:'Analyse'},
  {n:11, name:'Intégration',                               domain:'Analyse'},
  {n:12, name:'Suites et séries de fonctions',             domain:'Analyse'},
  {n:13, name:'Séries entières',                           domain:'Analyse'},
  {n:14, name:'Équations différentielles',                 domain:'Analyse'},
  {n:15, name:'Calcul différentiel',                       domain:'Analyse'},
  {n:16, name:'Probabilités',                              domain:'Probabilités'},
  {n:17, name:'Compléments',                               domain:'Compléments'},
];
const LEVELS = ['MPSI', 'MP', 'MP*'];
function chapterInfo(n) { return CHAPTERS.find(c => c.n === Number(n)); }

function fullStatementText(p) {
  const parts = [p.statement];
  if (p.formula) parts.push(`Formule : ${p.formula}`);
  if (p.followup) parts.push(p.followup);
  if (p.questions?.length) parts.push(p.questions.map((q,i) => `${i+1}. ${q}`).join('\n'));
  if (p.remark) parts.push(p.remark);
  return parts.join('\n\n');
}

// ── Contenu chargé depuis exercices/, cours/ et annales/ ──
// Pour ajouter un problème : crée <dossier>/<id>.json (avec domain, chapter,
// level, difficulty) puis ajoute son nom de fichier dans <dossier>/index.json.
let EXERCICES = [];
let COURS = [];
let ANNALES = [];
let PROBLEMS = []; // liste active pour les sections 'exercices' et 'cours'

async function loadProblemSet(folder) {
  const idxRes = await fetch(`${folder}/index.json`);
  if (!idxRes.ok) throw new Error(`Impossible de charger ${folder}/index.json (HTTP ${idxRes.status})`);
  const files = await idxRes.json();
  return Promise.all(files.map(async f => {
    const res = await fetch(`${folder}/${f}`);
    if (!res.ok) throw new Error(`Impossible de charger ${folder}/${f} (HTTP ${res.status})`);
    return res.json();
  }));
}

async function loadAllContent() {
  [EXERCICES, COURS, ANNALES] = await Promise.all([
    loadProblemSet('exercices'),
    loadProblemSet('cours'),
    loadProblemSet('annales'),
  ]);
  PROBLEMS = EXERCICES;
}

// ── State ──────────────────────────────────────────────
let currentIdx = 0;
let filters = { domain: '', chapter: '', level: '', difficulty: '' };
let currentElo = 1200;
let evaluated = false;
let msgTimer = null;
let adviceMsgTimer = null;
let adviceLoading = false;
const loadMsgs = ['Analyse en cours…','Vérification de la structure…','Évaluation de la rigueur…','Calcul du score de confiance…'];
const adviceMsgs = ['Lecture de votre brouillon…','Réflexion en cours…','Préparation d\'un conseil…'];

// ── Appel Gemini via worker ────────────────────────────
async function callAI(prompt) {
  if (!WORKER_URL) throw new Error('URL du worker non configurée.');
  const res = await fetch(WORKER_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: sessionPassword, prompt })
  });
  const data = await res.json();
  if (res.status === 401) throw new Error('Session expirée — rechargez la page.');
  if (!res.ok) throw new Error(data?.error || `HTTP ${res.status}`);
  if (!data.text) throw new Error('Réponse vide du worker');
  return data.text;
}

// ── Filtres & sélecteur ─────────────────────────────────
function filteredProblems() {
  return PROBLEMS.filter(p =>
    (!filters.domain || p.domain === filters.domain) &&
    (!filters.chapter || String(p.chapter) === filters.chapter) &&
    (!filters.level || p.level === filters.level) &&
    (!filters.difficulty || String(p.difficulty) === filters.difficulty)
  );
}

function buildSelector() {
  const domains = [...new Set(CHAPTERS.map(c => c.domain))];
  const chapterOpts = CHAPTERS
    .filter(c => !filters.domain || c.domain === filters.domain)
    .map(c => `<option value="${c.n}"${filters.chapter===String(c.n)?' selected':''}>${c.n}. ${c.name}</option>`)
    .join('');

  document.getElementById('selector-bar').innerHTML = `
    <div class="filter-row">
      <select class="filter-select" onchange="onFilterChange('domain', this.value)">
        <option value="">Toutes matières</option>
        ${domains.map(d => `<option value="${d}"${filters.domain===d?' selected':''}>${d}</option>`).join('')}
      </select>
      <select class="filter-select" onchange="onFilterChange('chapter', this.value)">
        <option value="">Tous chapitres</option>
        ${chapterOpts}
      </select>
      <select class="filter-select" onchange="onFilterChange('level', this.value)">
        <option value="">Tous niveaux</option>
        ${LEVELS.map(l => `<option value="${l}"${filters.level===l?' selected':''}>${l}</option>`).join('')}
      </select>
      <select class="filter-select" onchange="onFilterChange('difficulty', this.value)">
        <option value="">Toutes difficultés</option>
        ${[1,2,3,4,5].map(d => `<option value="${d}"${filters.difficulty===String(d)?' selected':''}>Niveau ${d}/5</option>`).join('')}
      </select>
    </div>
    <div class="prob-list" id="prob-list"></div>`;

  renderProbList();
}

function renderProbList() {
  const list = filteredProblems();
  const wrap = document.getElementById('prob-list');
  if (!list.length) {
    wrap.innerHTML = `<div class="no-results">Aucun problème ne correspond à ces filtres.</div>`;
    return;
  }
  const options = list.map(p => {
    const idx = PROBLEMS.indexOf(p);
    return `<option value="${idx}"${idx===currentIdx?' selected':''}>#${String(idx+1).padStart(3,'0')} — ${p.title}</option>`;
  }).join('');
  wrap.innerHTML = `
    <div class="prob-picker">
      <select class="filter-select prob-select" onchange="switchProblem(Number(this.value))">${options}</select>
      <span class="prob-count">${list.length} exercice${list.length>1?'s':''}</span>
    </div>`;
}

function onFilterChange(key, value) {
  filters[key] = value;
  if (key === 'domain' && value && filters.chapter && chapterInfo(filters.chapter)?.domain !== value) {
    filters.chapter = '';
  }
  const list = filteredProblems();
  if (list.length) {
    if (!list.includes(PROBLEMS[currentIdx])) {
      currentIdx = PROBLEMS.indexOf(list[0]);
      evaluated = false;
    }
    buildSelector();
    renderProblem(currentIdx);
  } else {
    buildSelector();
    document.getElementById('main-content').innerHTML = `<p style="font-family:var(--mono);color:var(--muted);padding:24px 0">Aucun problème ne correspond à ces filtres.</p>`;
  }
}

function switchProblem(idx) {
  currentIdx = idx;
  evaluated = false;
  buildSelector();
  renderProblem(idx);
}

// ── Sections (onglets) ──────────────────────────────────
let currentSection = 'exercices';

function switchSection(section) {
  currentSection = section;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === section));

  if (section === 'exercices' || section === 'cours') {
    PROBLEMS = section === 'exercices' ? EXERCICES : COURS;
    filters = { domain: '', chapter: '', level: '', difficulty: '' };
    currentIdx = 0;
    evaluated = false;
    if (PROBLEMS.length) {
      buildSelector();
      renderProblem(0);
    } else {
      document.getElementById('selector-bar').innerHTML = '';
      document.getElementById('main-content').innerHTML = '<p class="no-results-main">Aucun contenu disponible.</p>';
    }
  } else if (section === 'annales') {
    annaleFilters = { concours: '', annee: '' };
    if (ANNALES.length) {
      currentSujetId = ANNALES[0].id;
      buildAnnalesSelector();
      renderSujet(currentSujetId);
    } else {
      document.getElementById('selector-bar').innerHTML = '';
      document.getElementById('main-content').innerHTML = '<p class="no-results-main">Aucun sujet disponible.</p>';
    }
  }
  window.scrollTo({top:0, behavior:'smooth'});
}

// ── Annales de concours ─────────────────────────────────
let annaleFilters = { concours: '', annee: '' };
let currentSujetId = null;
let annaleEvaluated = {};

function filteredSujets() {
  return ANNALES.filter(s =>
    (!annaleFilters.concours || s.concours === annaleFilters.concours) &&
    (!annaleFilters.annee || String(s.annee) === annaleFilters.annee)
  );
}

function buildAnnalesSelector() {
  const concoursList = [...new Set(ANNALES.map(s => s.concours))];
  const anneesList = [...new Set(ANNALES.map(s => s.annee))].sort((a,b) => b-a);

  document.getElementById('selector-bar').innerHTML = `
    <div class="filter-row">
      <select class="filter-select" onchange="onAnnaleFilterChange('concours', this.value)">
        <option value="">Tous concours</option>
        ${concoursList.map(c => `<option value="${c}"${annaleFilters.concours===c?' selected':''}>${c}</option>`).join('')}
      </select>
      <select class="filter-select" onchange="onAnnaleFilterChange('annee', this.value)">
        <option value="">Toutes années</option>
        ${anneesList.map(a => `<option value="${a}"${annaleFilters.annee===String(a)?' selected':''}>${a}</option>`).join('')}
      </select>
    </div>
    <div class="prob-list" id="sujet-list"></div>`;
  renderSujetList();
}

function renderSujetList() {
  const list = filteredSujets();
  const wrap = document.getElementById('sujet-list');
  if (!list.length) {
    wrap.innerHTML = `<div class="no-results">Aucun sujet ne correspond à ces filtres.</div>`;
    return;
  }
  const options = list.map(s =>
    `<option value="${s.id}"${s.id===currentSujetId?' selected':''}>${s.concours} ${s.filiere} ${s.annee} — ${s.epreuve}</option>`
  ).join('');
  wrap.innerHTML = `
    <div class="prob-picker">
      <select class="filter-select prob-select" onchange="switchSujet(this.value)">${options}</select>
      <span class="prob-count">${list.length} sujet${list.length>1?'s':''}</span>
    </div>`;
}

function onAnnaleFilterChange(key, value) {
  annaleFilters[key] = value;
  const list = filteredSujets();
  if (list.length) {
    if (!list.some(s => s.id === currentSujetId)) currentSujetId = list[0].id;
    buildAnnalesSelector();
    renderSujet(currentSujetId);
  } else {
    buildAnnalesSelector();
    document.getElementById('main-content').innerHTML = '<p class="no-results-main">Aucun sujet ne correspond à ces filtres.</p>';
  }
}

function switchSujet(id) {
  currentSujetId = id;
  buildAnnalesSelector();
  renderSujet(id);
}

function stripHtml(html) {
  return html.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
}

function questionContextText(sujet, qid) {
  const parts = [];
  for (const b of sujet.blocks) {
    if (b.type === 'heading') parts.push(b.title);
    else if (b.type === 'text') parts.push(stripHtml(b.html));
    else if (b.type === 'question') {
      let s = `${b.id}. ${b.statement}`;
      if (b.formula) s += ` ${b.formula}`;
      if (b.followup) s += ` ${b.followup}`;
      parts.push(s);
      if (b.id === qid) break;
    }
  }
  return parts.join('\n');
}

function renderQuestionBlockHTML(sujetId, b) {
  return `
    <div class="qblock" id="qblock-${b.id}">
      <div class="q-head">${b.id}.</div>
      <div class="q-statement">${b.statement}</div>
      ${b.formula ? `<div class="math-block">\\[${b.formula}\\]</div>` : ''}
      ${b.followup ? `<div class="q-statement">${b.followup}</div>` : ''}
      <textarea class="answer-textarea" placeholder="Votre réponse…"></textarea>
      <div class="loading-bar q-loading">
        <div class="spinner"></div>
        <span class="load-msg">Analyse en cours…</span>
      </div>
      <div class="q-foot">
        <div class="char-count">0 caractère</div>
        <button class="btn-val" onclick="validateAnnaleAnswer('${sujetId}','${b.id}')">Valider la réponse</button>
      </div>
      <div class="scores-panel">
        <div class="sc-head"><h2>Résultat</h2><div class="verdict">—</div></div>
        <div class="sc-grid"></div>
        <div class="feedback-wrap">
          <div class="fb-label">Retour détaillé</div>
          <div class="fb-text">…</div>
        </div>
        <div class="err-msg"></div>
        <button class="btn-retry" style="display:none" onclick="retryAnnaleEval('${sujetId}','${b.id}')">Relancer l'évaluation</button>
      </div>
    </div>`;
}

function renderSujet(id) {
  const sujet = ANNALES.find(s => s.id === id);
  if (!sujet) return;
  document.getElementById('hdr-cat').textContent = `${sujet.concours} ${sujet.filiere} ${sujet.annee}`;

  let body = '';
  sujet.blocks.forEach(b => {
    if (b.type === 'heading') body += `<h3 class="ann-heading ann-h${b.level}">${b.title}</h3>`;
    else if (b.type === 'text') body += `<div class="ann-text">${b.html}</div>`;
    else if (b.type === 'question') body += renderQuestionBlockHTML(sujet.id, b);
  });

  document.getElementById('main-content').innerHTML = `
    <div class="meta-row">
      <div class="tag">${sujet.concours} · ${sujet.filiere} · ${sujet.annee}</div>
      <div class="diff-row">${sujet.epreuve}${sujet.duree ? ' · ' + sujet.duree : ''}</div>
    </div>
    <div class="problem-card">
      <div class="prob-head"><div class="prob-title">${sujet.epreuve}</div></div>
      <div class="prob-body">${body}</div>
    </div>`;

  document.querySelectorAll('.qblock').forEach(qb => {
    const ta = qb.querySelector('.answer-textarea');
    const ccEl = qb.querySelector('.char-count');
    ta.addEventListener('input', () => {
      const n = ta.value.length;
      ccEl.textContent = n + ' caractère' + (n>1?'s':'');
    });
  });

  if (window.MathJax) MathJax.typesetPromise();
}

async function validateAnnaleAnswer(sujetId, qid) {
  const key = sujetId + '::' + qid;
  const block = document.getElementById('qblock-' + qid);
  if (!block) return;
  const answer = block.querySelector('.answer-textarea').value.trim();
  if (!answer || answer.length < 10 || annaleEvaluated[key]) return;

  annaleEvaluated[key] = true;
  const btn = block.querySelector('.btn-val');
  btn.disabled = true;
  btn.textContent = 'Évaluation…';
  block.querySelector('.q-loading').classList.add('on');
  block.querySelector('.scores-panel').classList.remove('on');
  block.querySelector('.err-msg').classList.remove('on');

  const sujet = ANNALES.find(s => s.id === sujetId);
  const context = questionContextText(sujet, qid);
  const prompt = `Tu es un correcteur expert en mathématiques de classes préparatoires (${sujet.filiere}), corrigeant une épreuve de concours (${sujet.concours} ${sujet.annee}, ${sujet.epreuve}).

Contexte de l'épreuve jusqu'à la question ${qid} incluse :
${context}

Évalue la réponse ci-dessous à la question ${qid} uniquement. Réponds UNIQUEMENT avec un objet JSON valide contenant exactement ces champs :
{
  "correctness": <entier 0-100, justesse mathématique>,
  "correctness_comment": <string 1-2 phrases>,
  "completeness": <entier 0-100, complétude>,
  "completeness_comment": <string 1-2 phrases>,
  "rigor": <entier 0-100, rigueur des justifications>,
  "rigor_comment": <string 1-2 phrases>,
  "clarity": <entier 0-100, clarté de rédaction>,
  "clarity_comment": <string 1-2 phrases>,
  "confidence": <entier 0-100, certitude de l'évaluation>,
  "feedback": <string 3-5 phrases constructives en français>
}

Réponse de l'étudiant à la question ${qid} :
${answer}`;

  try {
    const text = await callAI(prompt);
    let raw = text.trim().replace(/```json\s*/gi,'').replace(/```\s*/g,'');
    const s = raw.indexOf('{'), e = raw.lastIndexOf('}');
    if (s===-1||e===-1) throw new Error('Aucun JSON dans la réponse');
    raw = raw.slice(s, e+1);
    const result = JSON.parse(raw);
    if (typeof result.correctness !== 'number') throw new Error('Champs manquants');

    block.querySelector('.q-loading').classList.remove('on');
    renderAnnaleScores(block, result);
    btn.textContent = 'Évalué ✓';

  } catch(err) {
    block.querySelector('.q-loading').classList.remove('on');
    const el = block.querySelector('.err-msg');
    el.textContent = err.message || 'Erreur inconnue';
    el.classList.add('on');
    block.querySelector('.scores-panel').classList.add('on');
    block.querySelector('.btn-retry').style.display = 'inline-block';
    annaleEvaluated[key] = false;
    btn.disabled = false;
    btn.textContent = 'Valider la réponse';
  }
}

function renderAnnaleScores(block, data) {
  const dims = [
    {key:'correctness',label:'Correction mathématique'},
    {key:'completeness',label:'Complétude'},
    {key:'rigor',label:'Rigueur & formalisme'},
    {key:'clarity',label:'Clarté de rédaction'},
  ];
  const grid = block.querySelector('.sc-grid');
  grid.innerHTML = dims.map(d => {
    const s = data[d.key]??0;
    return `<div class="sc-item">
      <div class="sc-label">${d.label}</div>
      <div class="sc-bar-row">
        <div class="sc-track"><div class="sc-fill ${fc(s)}" data-bar="${d.key}"></div></div>
        <div class="sc-val ${cc(s)}">${s}</div>
      </div>
      <div class="sc-comment">${data[d.key+'_comment']||''}</div>
    </div>`;
  }).join('');

  const conf = data.confidence??50;
  grid.innerHTML += `<div class="conf-row">
    <div class="conf-label">Confiance IA</div>
    <div class="conf-track"><div class="conf-fill" data-bar="conf"></div></div>
    <div class="conf-pct">${conf}%</div>
    <div class="conf-note">non calibré</div>
  </div>`;

  requestAnimationFrame(() => {
    dims.forEach((d,i) => {
      const el = grid.querySelector(`[data-bar="${d.key}"]`);
      setTimeout(() => { if (el) el.style.width = (data[d.key]??0) + '%'; }, 80+i*120);
    });
    const confEl = grid.querySelector('[data-bar="conf"]');
    setTimeout(() => { if (confEl) confEl.style.width = conf + '%'; }, 560);
  });

  const overall = Math.round(dims.reduce((a,d)=>a+(data[d.key]??0),0)/4);
  const vEl = block.querySelector('.verdict');
  if (overall>=70){vEl.textContent='Correct';vEl.className='verdict ok';}
  else if(overall>=40){vEl.textContent='Partiel';vEl.className='verdict mid';}
  else{vEl.textContent='Insuffisant';vEl.className='verdict bad';}

  block.querySelector('.fb-text').textContent = data.feedback||'';
  block.querySelector('.scores-panel').classList.add('on');
  if (window.MathJax) MathJax.typesetPromise();
}

function retryAnnaleEval(sujetId, qid) {
  const key = sujetId + '::' + qid;
  annaleEvaluated[key] = false;
  const block = document.getElementById('qblock-' + qid);
  block.querySelector('.err-msg').classList.remove('on');
  block.querySelector('.btn-retry').style.display = 'none';
  validateAnnaleAnswer(sujetId, qid);
}

// ── Brouillon / conseil IA ─────────────────────────────
function startAdviceLoading() {
  let i = 0;
  const el = document.getElementById('draft-load-msg');
  if (el) el.textContent = adviceMsgs[0];
  adviceMsgTimer = setInterval(() => {
    i = (i+1) % adviceMsgs.length;
    const el = document.getElementById('draft-load-msg');
    if (!el) return;
    el.style.opacity = '0';
    setTimeout(() => { el.textContent = adviceMsgs[i]; el.style.opacity = '1'; }, 200);
  }, 2200);
}
function stopAdviceLoading() { if (adviceMsgTimer) { clearInterval(adviceMsgTimer); adviceMsgTimer = null; } }

async function askAdvice() {
  const draft = document.getElementById('draft')?.value?.trim();
  if (!draft || draft.length < 5 || adviceLoading) return;

  adviceLoading = true;
  const btn = document.getElementById('btn-advice');
  btn.disabled = true;
  btn.textContent = 'Réflexion…';
  document.getElementById('draft-loading-bar').classList.add('on');
  document.getElementById('advice-wrap').style.display = 'none';
  document.getElementById('advice-err').classList.remove('on');
  startAdviceLoading();

  const p = PROBLEMS[currentIdx];
  const context = p.correction || p.grading_context;
  const prompt = `Tu es un tuteur bienveillant qui encadre un étudiant de classes préparatoires (MPSI/MP) sur l'exercice suivant.

Énoncé : ${fullStatementText(p)}

Solution de référence (réservée à toi, ne la révèle jamais à l'étudiant, même partiellement ou reformulée) : ${context}

L'étudiant te partage ci-dessous un brouillon : ses idées, ses tentatives, ou une question qu'il se pose. Donne-lui un conseil personnalisé et progressif : oriente-le, signale une éventuelle erreur ou une piste prometteuse, sans donner la solution complète ni le résultat final. Réponds en français, en 3 à 5 phrases claires et encourageantes, en texte brut (pas de JSON, pas de markdown).

Brouillon de l'étudiant :
${draft}`;

  try {
    const text = await callAI(prompt);
    const advice = text.trim().replace(/^```[a-z]*\s*/i,'').replace(/```\s*$/,'');

    stopAdviceLoading();
    document.getElementById('draft-loading-bar').classList.remove('on');
    document.getElementById('advice-text').textContent = advice;
    document.getElementById('advice-wrap').style.display = 'block';
    btn.textContent = 'Demander un conseil';

  } catch(err) {
    stopAdviceLoading();
    document.getElementById('draft-loading-bar').classList.remove('on');
    const el = document.getElementById('advice-err');
    el.textContent = err.message || 'Erreur inconnue';
    el.classList.add('on');
    btn.textContent = 'Demander un conseil';
  } finally {
    adviceLoading = false;
    btn.disabled = false;
  }
}

function nextProblem() {
  const list = filteredProblems();
  if (!list.length) return;
  const pos = list.indexOf(PROBLEMS[currentIdx]);
  const next = list[(pos + 1) % list.length];
  switchProblem(PROBLEMS.indexOf(next));
  window.scrollTo({top:0,behavior:'smooth'});
}

// ── Loading ────────────────────────────────────────────
function startLoading() {
  let i = 0;
  const el = document.getElementById('load-msg');
  if (el) el.textContent = loadMsgs[0];
  msgTimer = setInterval(() => {
    i = (i+1) % loadMsgs.length;
    const el = document.getElementById('load-msg');
    if (!el) return;
    el.style.opacity = '0';
    setTimeout(() => { el.textContent = loadMsgs[i]; el.style.opacity = '1'; }, 200);
  }, 2200);
}
function stopLoading() { if (msgTimer) { clearInterval(msgTimer); msgTimer = null; } }

// ── Scores ─────────────────────────────────────────────
function cc(s){return s>=70?'g':s>=40?'m':'r';}
function fc(s){return s>=70?'fill-g':s>=40?'fill-m':'fill-r';}
function animBar(id,pct,delay){setTimeout(()=>{const el=document.getElementById(id);if(el)el.style.width=pct+'%';},delay||0);}

function renderScores(data) {
  const dims = [
    {key:'correctness',label:'Correction mathématique'},
    {key:'completeness',label:'Complétude'},
    {key:'rigor',label:'Rigueur & formalisme'},
    {key:'clarity',label:'Clarté de rédaction'},
  ];
  const grid = document.getElementById('sc-grid');
  grid.innerHTML = dims.map(d => {
    const s = data[d.key]??0;
    return `<div class="sc-item">
      <div class="sc-label">${d.label}</div>
      <div class="sc-bar-row">
        <div class="sc-track"><div class="sc-fill ${fc(s)}" id="bar-${d.key}"></div></div>
        <div class="sc-val ${cc(s)}">${s}</div>
      </div>
      <div class="sc-comment">${data[d.key+'_comment']||''}</div>
    </div>`;
  }).join('');

  const conf = data.confidence??50;
  grid.innerHTML += `<div class="conf-row">
    <div class="conf-label">Confiance IA</div>
    <div class="conf-track"><div class="conf-fill" id="bar-conf"></div></div>
    <div class="conf-pct">${conf}%</div>
    <div class="conf-note">non calibré</div>
  </div>`;

  requestAnimationFrame(() => {
    dims.forEach((d,i) => animBar('bar-'+d.key, data[d.key]??0, 80+i*120));
    animBar('bar-conf', conf, 560);
  });

  const overall = Math.round(dims.reduce((a,d)=>a+(data[d.key]??0),0)/4);
  const vEl = document.getElementById('verdict');
  if (overall>=70){vEl.textContent='Correct';vEl.className='verdict ok';}
  else if(overall>=40){vEl.textContent='Partiel';vEl.className='verdict mid';}
  else{vEl.textContent='Insuffisant';vEl.className='verdict bad';}

  document.getElementById('fb-text').textContent = data.feedback||'';

  const delta = data.elo_delta??0;
  currentElo += delta;
  const eEl = document.getElementById('elo-delta');
  eEl.textContent = (delta>=0?'+':'')+delta;
  eEl.className = 'elo-delta'+(delta<0?' neg':'');
  document.getElementById('new-elo').textContent = currentElo;
  document.getElementById('elo-display').textContent = currentElo;
}

// ── Validate ───────────────────────────────────────────
async function validateAnswer() {
  const answer = document.getElementById('answer')?.value?.trim();
  if (!answer || answer.length < 20 || evaluated) return;

  evaluated = true;
  const btn = document.getElementById('btn-val');
  btn.disabled = true;
  btn.textContent = 'Évaluation…';
  document.getElementById('loading-bar').classList.add('on');
  document.getElementById('scores-panel').classList.remove('on');
  document.getElementById('err-msg').classList.remove('on');
  startLoading();

  const p = PROBLEMS[currentIdx];
  const context = p.correction || p.grading_context;
  const prompt = `Tu es un correcteur expert en mathématiques de classes préparatoires (MPSI/MP).

Énoncé : ${fullStatementText(p)}

Solution de référence (réservée à toi, ne la recopie jamais telle quelle dans ton retour) : ${context}

Évalue la démonstration ci-dessous. Réponds UNIQUEMENT avec un objet JSON valide contenant exactement ces champs :
{
  "correctness": <entier 0-100, justesse mathématique>,
  "correctness_comment": <string 1-2 phrases>,
  "completeness": <entier 0-100, complétude et cas d'égalité>,
  "completeness_comment": <string 1-2 phrases>,
  "rigor": <entier 0-100, rigueur des justifications>,
  "rigor_comment": <string 1-2 phrases>,
  "clarity": <entier 0-100, clarté de rédaction>,
  "clarity_comment": <string 1-2 phrases>,
  "confidence": <entier 0-100, certitude de l'évaluation>,
  "feedback": <string 3-5 phrases constructives en français>,
  "elo_delta": <entier -30 à +30>
}

Démonstration à évaluer :
${answer}`;

  try {
    const text = await callAI(prompt);
    let raw = text.trim().replace(/```json\s*/gi,'').replace(/```\s*/g,'');
    const s = raw.indexOf('{'), e = raw.lastIndexOf('}');
    if (s===-1||e===-1) throw new Error('Aucun JSON dans la réponse');
    raw = raw.slice(s, e+1);
    const result = JSON.parse(raw);
    if (typeof result.correctness !== 'number') throw new Error('Champs manquants');

    stopLoading();
    document.getElementById('loading-bar').classList.remove('on');
    document.getElementById('scores-panel').classList.add('on');
    renderScores(result);
    btn.textContent = 'Évalué ✓';

  } catch(err) {
    stopLoading();
    document.getElementById('loading-bar').classList.remove('on');
    const el = document.getElementById('err-msg');
    el.textContent = err.message || 'Erreur inconnue';
    el.classList.add('on');
    document.getElementById('scores-panel').classList.add('on');
    document.getElementById('btn-retry').style.display = 'inline-block';
    evaluated = false;
    btn.disabled = false;
    btn.textContent = 'Valider la réponse';
  }
}

function retryEval() {
  evaluated = false;
  document.getElementById('err-msg').classList.remove('on');
  document.getElementById('btn-retry').style.display = 'none';
  validateAnswer();
}

// ── Login gate ─────────────────────────────────────────
let sessionPassword = null; // mot de passe tapé, gardé en mémoire le temps de la session

function checkLogin() {
  showLogin();
}

function showLogin() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app-wrapper').style.display = 'none';
  setTimeout(() => document.getElementById('login-input').focus(), 100);
}

async function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-wrapper').style.display = 'contents';
  document.getElementById('main-content').innerHTML = '<p style="font-family:var(--mono);color:var(--muted);padding:24px 0">Chargement des problèmes…</p>';
  try {
    await problemsPromise;
  } catch (e) {
    document.getElementById('main-content').innerHTML = `<p style="font-family:var(--mono);color:var(--danger);padding:24px 0">${e.message}</p>`;
    return;
  }
  buildSelector();
  renderProblem(0);
}

async function submitLogin() {
  const val = document.getElementById('login-input').value.trim();
  if (!val) return;

  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  btn.textContent = 'Vérification…';

  // Teste le mot de passe contre le worker
  try {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: val, prompt: 'ping' })
    });

    if (res.status === 401) {
      throw new Error('incorrect');
    }

    // Mot de passe accepté — on le garde en mémoire
    sessionPassword = val;
    document.getElementById('login-error').style.display = 'none';
    await showApp();

  } catch(e) {
    document.getElementById('login-error').style.display = 'block';
    document.getElementById('login-input').value = '';
    document.getElementById('login-input').focus();
    const box = document.getElementById('login-box');
    box.style.animation = 'none';
    box.offsetHeight;
    box.style.animation = 'shake .4s ease';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Accéder';
  }
}

let problemsPromise = null;

document.addEventListener('DOMContentLoaded', () => {
  problemsPromise = loadAllContent();
  document.getElementById('login-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') submitLogin();
  });
  checkLogin();
});
</script>
