<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Math Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-chtml.min.js"></script>
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:100;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:16px">
  <div id="login-box" class="login-box">
    <div class="login-logo">Math<span>Arena</span></div>
    <div class="login-options">
      <div class="login-card" id="google-login-card" style="display:none">
        <button id="google-login-btn" class="google-btn" onclick="startGoogleLogin()" type="button">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.8 2.73v2.27h2.91c1.7-1.57 2.69-3.88 2.69-6.64z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.17l-2.91-2.27c-.81.54-1.84.86-3.05.86-2.35 0-4.34-1.58-5.05-3.71H.96v2.34C2.44 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.95 10.71c-.18-.54-.28-1.11-.28-1.71s.1-1.17.28-1.71V4.95H.96C.35 6.17 0 7.55 0 9s.35 2.83.96 4.05l2.99-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.95l2.99 2.34C4.66 5.16 6.65 3.58 9 3.58z"/></svg>
          <span>Connexion Google</span>
        </button>
        <div class="login-card-note">Utilise votre quota Gemini personnel</div>
      </div>
      <div class="login-divider" id="login-divider" style="display:none"><span>ou</span></div>
      <div class="login-card">
        <div class="login-card-title">Mot de passe</div>
        <input id="login-input" type="password" placeholder="Mot de passe…" class="login-input"/>
        <button id="login-btn" onclick="submitLogin()" class="login-pw-btn" type="button">Accéder</button>
        <div class="login-card-note">Quota partagé — limité</div>
      </div>
    </div>
    <div id="login-error" class="login-error">Mot de passe incorrect</div>
  </div>
</div>

<!-- APP -->
<div id="app-wrapper" style="display:none;width:100%;display:contents">
  <header>
    <div class="logo">Math<span>Arena</span></div>
    <div class="header-right">
      <span id="hdr-cat">—</span>
      <div class="model-select-wrap" id="model-select-wrap" style="display:none">
        <button type="button" class="model-select-btn" id="model-select-btn" onclick="toggleModelDropdown(event)">
          <span id="model-select-label">🤖 —</span>
          <span class="model-select-chevron">▾</span>
        </button>
        <span class="model-remaining" id="model-remaining"></span>
        <div class="model-dropdown" id="model-dropdown"></div>
      </div>
      <div class="elo-pill">ELO <b id="elo-display">1200</b></div>
      <div class="session-indicator" id="session-indicator"></div>
    </div>
  </header>
  <div class="quota-banner" id="quota-banner">
    <div class="quota-banner-inner">⚠️ Quota journalier épuisé — réessayez demain.</div>
  </div>
  <div class="tab-bar" id="tab-bar">
    <button class="tab-btn" data-tab="cours" onclick="switchSection('cours')">Questions de cours</button>
    <button class="tab-btn active" data-tab="exercices" onclick="switchSection('exercices')">Exercices</button>
    <button class="tab-btn" data-tab="annales" onclick="switchSection('annales')">Annales de concours</button>
  </div>
  <div class="selector-bar" id="selector-bar"></div>
  <div class="filters-panel" id="filters-panel"></div>
  <main id="main-content"></main>
</div>

<!-- CAMERA (photo de réponse manuscrite) -->
<div class="camera-modal" id="camera-modal">
  <div class="camera-modal-inner">
    <video id="camera-video" autoplay playsinline muted></video>
    <div class="camera-modal-actions">
      <button class="btn-val" onclick="capturePhoto()">Capturer</button>
      <button class="btn-retry" style="display:inline-block" onclick="closeCameraModal()">Annuler</button>
    </div>
  </div>
</div>

<!-- TUTOR (chatbot professeur) -->
<div class="tutor-launcher" id="tutor-launcher">
  <button class="tutor-avatar-btn" onclick="openTutorChat()" title="Discuter avec le professeur">🧑‍🏫</button>
  <div class="tutor-bubble" id="tutor-bubble" onclick="openTutorChat()">
    <span>Des questions ?</span>
    <button class="tutor-bubble-close" onclick="event.stopPropagation();dismissTutorBubble()" title="Masquer">×</button>
  </div>
</div>

<div class="tutor-chat-overlay" id="tutor-chat-overlay" onclick="closeTutorChat()"></div>
<div class="tutor-chat-panel" id="tutor-chat-panel">
  <div class="tutor-chat-head">
    <div class="tutor-chat-title">
      <span class="tutor-chat-avatar">🧑‍🏫</span>
      <div><b>Professeur</b><span>Toujours là pour t'aider</span></div>
    </div>
    <button class="tutor-chat-close" onclick="closeTutorChat()" title="Fermer">×</button>
  </div>
  <div class="tutor-chat-messages" id="tutor-chat-messages"></div>
  <div class="tutor-chat-loading" id="tutor-chat-loading">
    <div class="spinner"></div><span id="tutor-chat-load-msg">Réflexion en cours…</span>
  </div>
  <div class="err-msg" id="tutor-chat-err"></div>
  <div class="tutor-chat-input-area">
    <div id="tutor-attach-row-slot"></div>
    <div class="tutor-chat-input-row">
      <textarea id="tutor-chat-input" placeholder="Écris ton message…" rows="1"></textarea>
      <button class="tutor-chat-send-btn" id="tutor-chat-send" onclick="sendTutorMessage()" title="Envoyer">➤</button>
    </div>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/data-loader.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/grading.js"></script>
<script src="assets/js/filters.js"></script>
<script src="assets/js/tutor.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
